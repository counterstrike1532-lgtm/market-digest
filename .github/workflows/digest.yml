name: news digest

on:
  schedule:
    - cron: "17 5 * * 1-5"      # 07:17 Варшава летом, 06:17 зимой. Минута не :00 - меньше шанс дропа планировщиком GitHub
  workflow_dispatch:            # кнопка "Run workflow" для ручного запуска
    inputs:
      hours:
        description: "Окно свежести, часов"
        default: "26"
      drafts:
        description: "Сколько черновиков (T11e: DRAFT_PROMPT сам всегда пишет 2 - digest + single)"
        default: "2"

concurrency:
  group: digest
  cancel-in-progress: false     # прогон уже потратил квоту Gemini, прерывать на середине незачем

permissions:
  contents: write               # нужно, чтобы коммитить state/seen.json

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать и отправить сводку
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          GEMINI_MODEL:       ${{ vars.GEMINI_MODEL }}
          HOURS:              ${{ github.event.inputs.hours || '26' }}
          DRAFTS:             ${{ github.event.inputs.drafts || '2' }}
          NEWSBOT_ALLOW_LIVE: "1"
        run: |
          python -m src.main --hours "$HOURS" --drafts "$DRAFTS" 2>&1 | tee digest.log

      - name: Загрузить лог прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-log-${{ github.run_id }}
          path: digest.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Запомнить показанное
        id: remember
        continue-on-error: true   # сводка уже отправлена, падать на служебном коммите бессмысленно
        run: |
          git config user.name  "digest-bot"
          git config user.email "actions@github.com"
          git add state/seen.json state/metrics.json
          git diff --staged --quiet || git commit -m "state: seen items + run metrics $(date -u +%F)"
          git pull --rebase --autostash origin master || true
          git push

      - name: Notify on state commit failure
        if: steps.remember.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d disable_web_page_preview=true \
            --data-urlencode text="state не сохранён, возможны повторы сюжетов. Ран: $RUN_URL"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d disable_web_page_preview=true \
            --data-urlencode text="Дайджест упал. Лог: $RUN_URL"
